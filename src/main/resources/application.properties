# Nome da aplicação
spring.application.name=recicla-ords

# Conexão com o PostgreSQL (Docker)
spring.datasource.url=jdbc:postgresql://localhost:5433/recicla_db
spring.datasource.username=postgres
spring.datasource.password=postgrespassword
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Roda o schema.sql a cada início, antes do Hibernate (ajustes que o ddl-auto=update não faz sozinho)
spring.sql.init.mode=always

# Inclui a mensagem de erro no corpo das respostas (usada pelas telas)
server.error.include-message=always

# Tempo sem uso até o site pedir a senha de novo
server.servlet.session.timeout=30m
